<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b19"><title>BEAT — Kumo Lab</title><meta name="description" content="BEAT: siga o ritmo, toque na batida e supere seu recorde no Kumo Lab."><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 34%,#25224c,#080b19 72%);color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center}header{width:min(100%,700px);padding:22px;display:flex;justify-content:space-between}header a{color:#aeb5d9;text-decoration:none;font-size:12px}header b{font-size:12px;letter-spacing:.18em}header span,.tag{color:#fd75cf}main{width:min(100%,650px);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 20px 26px}.tag{font-size:11px;letter-spacing:.22em;font-weight:800}h1{font-size:clamp(75px,17vw,112px);line-height:1;letter-spacing:-.1em;margin:12px 0 6px}p{color:#b0b4d0;line-height:1.5;max-width:370px}.stats{display:flex;gap:36px;margin:15px 0}.stat{font-size:11px;color:#a7afcb;letter-spacing:.12em}.stat strong{display:block;font-size:27px;color:#fff;letter-spacing:0}.dial{width:min(72vw,310px);aspect-ratio:1;border:0;background:radial-gradient(circle,#252449,#12162b);border-radius:50%;position:relative;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;margin:10px auto 15px;box-shadow:0 0 55px #ef59be22,inset 0 0 70px #0008;overflow:hidden}.ring{position:absolute;inset:12px;border:11px solid #fd75cf;border-radius:50%;opacity:.85;box-shadow:0 0 24px #fd75cf88,inset 0 0 20px #fd75cf66;transform:scale(var(--scale,1));transition:transform .065s linear}.core{width:40%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff,#f7a7e4 32%,#b43393);box-shadow:0 0 65px #f75ac8bb;transform:scale(var(--pulse,.6));transition:transform .065s linear}.dial:active .core{filter:brightness(1.5)}.hint{font-size:12px;letter-spacing:.15em;font-weight:900;color:#f7acd9;min-height:25px}.action{border:0;border-radius:28px;background:#fd75cf;color:#1b0920;padding:15px 30px;font-size:13px;font-weight:900;letter-spacing:.1em;cursor:pointer;margin:5px}.secondary{background:#263052;color:#e8eaff;border:1px solid #55618a}.hidden{display:none!important}.actions{display:flex;flex-wrap:wrap;justify-content:center}.rank{position:fixed;right:15px;top:24%;width:205px;background:#14162edc;border:1px solid #444a72;border-radius:18px;padding:14px;text-align:left}.rank h3{font-size:12px;color:#fd75cf;letter-spacing:.12em}.rank ol{padding-left:23px;font-size:12px}.rank li{margin:9px 0}.rank li span{float:right;color:#fd75cf}.mobile{display:none}footer{font-size:11px;color:#8187aa;padding:20px}@media(max-width:990px){.rank{display:none}.mobile.shown{display:block;position:static;width:min(100%,340px);max-height:160px;overflow:auto;margin:14px auto 0}}@media(max-height:740px){h1{font-size:64px}.dial{width:min(57vw,230px)}.stats{margin:7px 0}p{margin:8px}}</style></head><body><header><a href="/jogos">← TODOS OS JOGOS</a><b>KUMO <span>/ LAB</span></b></header><main><div class="tag">RITMO / ARCADE</div><h1>BEAT<span style="color:#fd75cf">.</span></h1><p id="description">Ouça a música e toque no círculo no tempo da batida. Você tem 30 segundos.</p><div class="stats"><div class="stat">PONTOS<strong id="score">000</strong></div><div class="stat">COMBO<strong id="combo">0</strong></div><div class="stat">RECORDE<strong id="best">000</strong></div><div class="stat">TEMPO<strong id="time">30</strong></div></div><button class="dial" id="dial" aria-label="Toque na batida"><div class="ring" id="ring"></div><div class="core" id="core"></div></button><div class="hint" id="hint" aria-live="polite">PRONTO PARA O RITMO?</div><div class="actions"><button class="action" id="start">COMEÇAR</button><button class="action secondary hidden" id="share">COMPARTILHAR PLACAR ↗</button><button class="action secondary hidden" id="register">REGISTRAR @ NO TOP 10</button></div><aside class="rank mobile" id="mobile"><h3>TOP 10 GLOBAL</h3><ol id="mobilelist"></ol></aside></main><aside class="rank"><h3>TOP 10 GLOBAL</h3><ol id="ranklist"><li>Carregando...</li></ol></aside><footer>UM JOGO KUMO LAB · MELHOR COM SOM</footer><script>(()=>{'use strict';const $=id=>document.getElementById(id),dial=$('dial'),ring=$('ring'),core=$('core'),start=$('start'),share=$('share'),register=$('register'),hint=$('hint');let active=false,score=0,combo=0,best=0,startAt=0,nextBeat=0,period=700,raf=0,lastHit=-1,ctx=null,session=null,ended=false,musicStep=0;try{best=Number(localStorage.getItem('beatBest')||0)}catch(e){}$('best').textContent=String(best).padStart(3,'0');function sound(freq=220){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*.65,t+.11);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.1,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.16)}catch(e){}}function note(freq,duration=.2,volume=.035,type='triangle'){try{if(!ctx||ctx.state!=='running')return;const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+duration+.02)}catch(e){}}function musicBeat(){const roots=[220,174.61,196,164.81],root=roots[Math.floor(musicStep/8)%4],step=musicStep%8;note(root/2,.16,.055,'sine');if(step%2===0)note(root*2,.09,.024,'square');if(step===2||step===6)note(950,.055,.009,'triangle');const melody=[0,7,12,7,3,7,10,7];note(root*Math.pow(2,melody[step]/12),.25,.026,'triangle');musicStep++}function vibrate(){try{navigator.vibrate?.(20)}catch(e){}}function draw(now){if(!active)return;const elapsed=now-startAt,remaining=Math.max(0,30-Math.floor(elapsed/1000));$('time').textContent=remaining;if(elapsed>=30000){finish();return}while(now>=nextBeat){nextBeat+=period;musicBeat();period=Math.max(420,700-Math.floor(elapsed/6000)*40)}const dist=Math.abs(nextBeat-period-now),phase=Math.min(1,dist/(period*.5));ring.style.setProperty('--scale',String(1.02-phase*.14));core.style.setProperty('--pulse',String(1.1-phase*.5));raf=requestAnimationFrame(draw)}async function beginRank(){session=null;try{const r=await fetch('/api/ranking?game=beat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'start'})});if(r.ok)session=(await r.json()).session}catch(e){}}async function refreshRank(){try{const r=await fetch('/api/ranking?game=beat'),d=await r.json();if(!r.ok)throw Error();const h=(d.top||[]).map(x=>'<li>'+x.handle.replace(/[<>&]/g,'')+' <span>'+x.score+'</span></li>').join('')||'<li>Seja o primeiro!</li>';$('ranklist').innerHTML=h;$('mobilelist').innerHTML=h}catch(e){$('ranklist').textContent='Ranking indisponível';$('mobilelist').textContent='Ranking indisponível'}}function audioUnlock(){try{ctx??=new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch(e){}}function begin(){cancelAnimationFrame(raf);active=true;ended=false;score=0;combo=0;lastHit=-1;period=700;musicStep=0;audioUnlock();startAt=performance.now();nextBeat=startAt+700;$('score').textContent='000';$('combo').textContent='0';$('time').textContent='30';hint.textContent='SIGA A BATIDA!';start.classList.add('hidden');share.classList.add('hidden');register.classList.add('hidden');$('mobile').classList.remove('shown');beginRank();sound(330);raf=requestAnimationFrame(draw)}function hit(){if(!active)return;const now=performance.now(),elapsed=now-startAt;if(elapsed>=30000){finish();return}const n=Math.round((now-(nextBeat-period))/period),target=nextBeat-period+n*period;if(lastHit===target)return;lastHit=target;const diff=Math.abs(now-target);if(diff<=85){combo++;score+=100+Math.min(combo,20)*10;hint.textContent='PERFEITO +'+(100+Math.min(combo,20)*10);vibrate();sound(600)}else if(diff<=165){combo++;score+=50+Math.min(combo,20)*5;hint.textContent='BOM!';sound(430)}else{combo=0;hint.textContent='FORA DO RITMO';sound(120)}$('score').textContent=String(score).padStart(3,'0');$('combo').textContent=combo}function finish(){if(ended)return;ended=true;active=false;cancelAnimationFrame(raf);$('time').textContent='0';best=Math.max(best,score);try{localStorage.setItem('beatBest',String(best))}catch(e){}$('best').textContent=String(best).padStart(3,'0');hint.textContent='FIM DE JOGO · '+score+' PONTOS';start.textContent='JOGAR NOVAMENTE';start.classList.remove('hidden');share.classList.remove('hidden');register.classList.remove('hidden');$('mobile').classList.add('shown');refreshRank()}start.addEventListener('click',begin);dial.addEventListener('pointerdown',e=>{e.preventDefault();hit()});share.addEventListener('click',async()=>{const url='https://www.sistemakumo.com.br/beat.html',text='Fiz '+score+' pontos no BEAT do Kumo Lab! Consegue acompanhar meu ritmo?';try{if(navigator.share){await navigator.share({title:'BEAT — Meu placar',text,url});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(text+' '+url);share.textContent='COPIADO!'}catch(e){window.prompt('Copie seu placar:',text+' '+url)}});register.addEventListener('click',async()=>{if(!session){alert('Ranking indisponível para esta partida.');return}let handle=prompt('Escolha seu @usuario (3 a 18 caracteres):');if(handle===null)return;handle=handle.trim().toLowerCase();if(!handle.startsWith('@'))handle='@'+handle;if(!/^@[a-z0-9_]{3,18}$/.test(handle)){alert('Use letras, números ou _ (3 a 18 caracteres).');return}try{const r=await fetch('/api/ranking?game=beat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'submit',game:'beat',handle,score,session})});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha');session=null;register.classList.add('hidden');refreshRank()}catch(e){alert('Não foi possível registrar: '+e.message)}});refreshRank()})();</script></body></html>
