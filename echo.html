<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d1b"><meta name="description" content="ECHO — memorize a sequência neon e supere seu recorde. Um jogo Kumo Lab."><title>ECHO — Kumo Lab</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 30%,#18233e,#090d1b 70%);font-family:system-ui,-apple-system,sans-serif;color:#f5f7ff;display:flex;flex-direction:column;align-items:center}header{width:min(100%,760px);padding:22px 24px;display:flex;justify-content:space-between;align-items:center}a{color:#a7b8dc;text-decoration:none;font-size:13px}header b{letter-spacing:.2em;font-size:13px}header b span{color:#69ffdd}main{width:min(100%,620px);padding:8px 20px 35px;text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}.tag{font-size:11px;letter-spacing:.25em;color:#69ffdd;font-weight:800}h1{font-size:clamp(65px,15vw,105px);letter-spacing:-.1em;line-height:1;margin:12px 0}p{color:#9cacca;line-height:1.55;max-width:400px;margin:12px auto 18px}.stats{display:flex;justify-content:center;gap:35px;margin:6px 0 20px}.stats div{font-size:11px;letter-spacing:.15em;color:#93a6c9}.stats strong{display:block;font-size:27px;color:#fff;letter-spacing:0}.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(80vw,340px);aspect-ratio:1;margin:10px auto 23px;transform:rotate(-3deg)}.pad{border:1px solid #ffffff22;border-radius:24px;cursor:pointer;touch-action:manipulation;transition:filter .09s,transform .09s,box-shadow .09s;opacity:.65;outline-offset:4px}.pad[data-i="0"]{background:#1dbd9e;box-shadow:inset 0 0 40px #083f37}.pad[data-i="1"]{background:#e750a0;box-shadow:inset 0 0 40px #652044}.pad[data-i="2"]{background:#e8b64e;box-shadow:inset 0 0 40px #614715}.pad[data-i="3"]{background:#6389ff;box-shadow:inset 0 0 40px #263b8c}.pad.lit{opacity:1;filter:brightness(1.75);transform:scale(1.045);box-shadow:0 0 45px currentColor}.pad[data-i="0"].lit{color:#25ffd1}.pad[data-i="1"].lit{color:#ff5ba8}.pad[data-i="2"].lit{color:#ffe079}.pad[data-i="3"].lit{color:#80a8ff}.status{font-size:12px;letter-spacing:.13em;min-height:25px;color:#b4c5e3;font-weight:800}.action{background:#69ffdd;color:#081321;border:0;border-radius:30px;padding:16px 34px;font-size:13px;letter-spacing:.12em;font-weight:900;cursor:pointer}.share{background:#1b2b48;color:#dbeaff;border:1px solid #526581;margin-top:10px}.hidden{display:none}.actions{display:flex;flex-direction:column;align-items:center}footer{padding:15px;color:#687a9c;font-size:11px;text-align:center}@media(max-height:750px){h1{font-size:62px}.board{width:min(63vw,260px);margin:4px auto 10px}p{margin:5px auto 10px}.stats{margin:4px 0 10px}}@media(prefers-reduced-motion:reduce){.pad{transition:none}}</style></head><body><header><a href="/jogos">← TODOS OS JOGOS</a><b>KUMO <span>/ LAB</span></b></header><main><div class="tag">MEMÓRIA / ARCADE</div><h1>ECHO<span style="color:#69ffdd">.</span></h1><p id="intro">Observe as luzes. Repita a sequência. A cada rodada, um novo desafio.</p><div class="stats"><div>RODADA<strong id="round">00</strong></div><div>RECORDE<strong id="best">00</strong></div></div><div class="board" id="board"><button class="pad" data-i="0" aria-label="Luz verde"></button><button class="pad" data-i="1" aria-label="Luz rosa"></button><button class="pad" data-i="2" aria-label="Luz amarela"></button><button class="pad" data-i="3" aria-label="Luz azul"></button></div><div class="status" id="status" aria-live="polite">PRONTO PARA JOGAR?</div><div class="actions"><button class="action" id="start">COMEÇAR</button><button class="action share hidden" id="share">COMPARTILHAR PLACAR ↗</button></div></main><footer>UM JOGO DE MEMÓRIA · SEM INSTALAÇÃO</footer><script>(()=>{'use strict';const pads=[...document.querySelectorAll('.pad')],start=document.getElementById('start'),share=document.getElementById('share'),status=document.getElementById('status'),round=document.getElementById('round'),bestEl=document.getElementById('best');let seq=[],index=0,phase='idle',token=0,best=0,audioCtx;try{best=Number(localStorage.getItem('echoBest')||0)}catch(e){}bestEl.textContent=String(best).padStart(2,'0');const wait=ms=>new Promise(r=>setTimeout(r,ms));function audio(){try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}}function tone(i){try{audio();if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.type='sine';o.frequency.value=[330,440,550,660][i];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.09,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.27)}catch(e){}}async function light(i,ms=280){pads[i].classList.add('lit');tone(i);await wait(ms);pads[i].classList.remove('lit')}async function playback(id){phase='watch';status.textContent='OBSERVE A SEQUÊNCIA';await wait(500);for(const i of seq){if(id!==token)return;await light(i,Math.max(190,430-seq.length*10));await wait(190)}if(id!==token)return;phase='input';index=0;status.textContent='SUA VEZ!'}async function next(id){seq.push(Math.floor(Math.random()*4));round.textContent=String(seq.length).padStart(2,'0');await playback(id)}function reset(){token++;seq=[];index=0;phase='watch';share.classList.add('hidden');start.classList.add('hidden');document.getElementById('intro').textContent='Memorize e repita cada luz na ordem correta.';audio();next(token)}function finish(){phase='over';token++;const score=Math.max(0,seq.length-1);best=Math.max(best,score);try{localStorage.setItem('echoBest',String(best))}catch(e){}bestEl.textContent=String(best).padStart(2,'0');round.textContent=String(score).padStart(2,'0');status.textContent='FIM DE JOGO · '+score+' RODADA'+(score===1?'':'S');start.textContent='JOGAR DE NOVO';start.classList.remove('hidden');share.classList.remove('hidden')}pads.forEach((p,i)=>p.addEventListener('pointerdown',async()=>{if(phase!=='input')return;phase='checking';light(i,200);if(i!==seq[index]){finish();return}index++;if(index===seq.length){phase='watch';status.textContent='PERFEITO!';const id=token;await wait(550);if(id===token)next(id)}else phase='input'}));start.addEventListener('click',reset);share.addEventListener('click',async()=>{const score=Math.max(0,seq.length-1),url='https://www.sistemakumo.com.br/echo.html',message='Cheguei à rodada '+score+' no ECHO do Kumo Lab! Consegue superar?';try{if(navigator.share){await navigator.share({title:'ECHO — Meu placar',text:message,url});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(message+' '+url);share.textContent='LINK COPIADO!'}catch(e){window.prompt('Copie e compartilhe:',message+' '+url)}})})();</script></body></html>
