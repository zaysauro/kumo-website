<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ÍMÃ — Kumo Lab</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#253457,#0a1020 75%);color:#fff;font:15px system-ui,-apple-system,sans-serif}header,main{max-width:760px;margin:auto;padding:16px}header{display:flex;justify-content:space-between}a{color:#9bdcf6;text-decoration:none}h1{font-size:clamp(58px,12vw,90px);letter-spacing:-.07em;margin:0}h1 span{color:#ff9d9f}p{color:#aebdd7}.stats,.buttons,.shop{display:flex;gap:9px;flex-wrap:wrap}.stats>div{flex:1;min-width:95px;background:#1d2e4d;border:1px solid #3d5278;padding:12px;border-radius:12px;color:#aebcdb;font-size:12px}.stats strong{display:block;color:white;font-size:26px}canvas{display:block;width:100%;height:min(58vh,460px);min-height:330px;border:2px solid #466384;border-radius:16px;background:#101b31;touch-action:manipulation;margin:14px 0}button{background:#273c5e;color:#fff;border:1px solid #59759d;border-radius:12px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:#ffb5b5;color:#26172b}.buttons{justify-content:center}.hint{text-align:center;min-height:28px;color:#ffd2d2;font-weight:800}.panel{margin:16px 0;padding:16px;border:1px solid #385174;border-radius:16px;background:#182842}.skin{flex:1;min-width:110px;text-align:center;padding:12px;border-radius:12px;background:#243553}.skin button{padding:8px;width:100%;font-size:12px}.skin button:disabled{opacity:.5}footer{text-align:center;color:#8294b5;padding:20px}</style></head><body><header><a href="/jogos">← TODOS OS JOGOS</a><b>KUMO / LAB</b></header><main><h1>ÍMÃ<span>.</span></h1><p>Alterne a polaridade para atrair as esferas metálicas ao centro. Cuidado: a polaridade errada as repele!</p><div class="stats"><div>PONTOS<strong id="score">0</strong></div><div>TEMPO<strong id="time">30</strong></div><div>MOEDAS<strong id="coins">0</strong></div><div>RECORDE<strong id="best">0</strong></div></div><canvas id="c"></canvas><div class="hint" id="hint">TOQUE EM COMEÇAR</div><div class="buttons"><button class="primary" id="start">COMEÇAR</button><button id="flip">INVERTER POLARIDADE</button><button id="music">MÚSICA: LIGADA</button></div><div class="panel"><h2>Skins magnéticas</h2><p>Moedas e skins são salvas neste navegador.</p><div class="shop" id="shop"></div></div></main><footer>© 2026 KUMO LAB</footer><script>(()=>{'use strict';const $=x=>document.getElementById(x),c=$('c'),g=c.getContext('2d'),KEY='kumo-ima-v1';let save={coins:0,owned:['red'],skin:'red',best:0};try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.owned))save={...save,...x}}catch(e){}const skins=[{id:'red',name:'Clássico',color:'#ff8d9c',cost:0},{id:'blue',name:'Cobalto',color:'#83b7ff',cost:70},{id:'mint',name:'Menta',color:'#88e9cc',cost:160},{id:'gold',name:'Dourado',color:'#f6d577',cost:300}];let W=700,H=440,active=false,score=0,earned=0,polarity=1,orbs=[],last=0,until=0,raf=0,audio=null,musicOn=true,musicStep=-1,spawn=0;function tone(f,d=.12,v=.07){if(!audio)return;try{let o=audio.createOscillator(),a=audio.createGain(),t=audio.currentTime;o.type='triangle';o.frequency.setValueAtTime(f,t);a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a).connect(audio.destination);o.start(t);o.stop(t+d+.01)}catch(e){}}function initAudio(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}}function fit(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;c.width=Math.round(W*d);c.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0)}function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}$('coins').textContent=save.coins;$('best').textContent=save.best;$('shop').innerHTML=skins.map(s=>{let own=save.owned.includes(s.id),eq=save.skin===s.id;return '<div class="skin"><div style="font-size:34px;color:'+s.color+'">⬡</div><b>'+s.name+'</b><p>'+(own?'Liberada':s.cost+' moedas')+'</p><button data-skin="'+s.id+'" '+(eq||(!own&&save.coins<s.cost)?'disabled':'')+'>'+(eq?'Equipada':own?'Equipar':'Comprar')+'</button></div>'}).join('')}function add(){let edge=Math.floor(Math.random()*4),x=edge===0?-10:edge===1?W+10:Math.random()*W,y=edge===2?-10:edge===3?H+10:Math.random()*H;orbs.push({x,y,vx:0,vy:0,r:8,pol:Math.random()<.5?1:-1,age:0})}function start(){initAudio();cancelAnimationFrame(raf);fit();orbs=[];score=0;earned=0;polarity=1;active=true;until=performance.now()+30000;last=performance.now();spawn=0;musicStep=-1;$('score').textContent=0;$('time').textContent=30;$('hint').textContent='TOQUE PARA INVERTER A POLARIDADE';for(let i=0;i<5;i++)add();raf=requestAnimationFrame(frame)}function flip(){if(!active)return;polarity*=-1;tone(polarity>0?520:320,.09);$('hint').textContent=polarity>0?'POLO POSITIVO (+)':'POLO NEGATIVO (−)'}function end(){active=false;cancelAnimationFrame(raf);save.coins+=earned;save.best=Math.max(score,save.best);persist();tone(690,.24);$('hint').textContent='FIM! '+score+' PONTOS • +'+earned+' MOEDAS';draw()}function frame(t){if(!active)return;let dt=Math.min(.033,(t-last)/1000||0);last=t;let left=(until-t)/1000;$('time').textContent=Math.max(0,Math.ceil(left));if(left<=0){end();return}spawn+=dt;if(spawn>.9){spawn=0;add()}let cx=W/2,cy=H/2;for(let b of orbs){let dx=cx-b.x,dy=cy-b.y,d=Math.max(20,Math.hypot(dx,dy)),sign=b.pol===polarity?-1:1,force=sign*Math.min(1450,170000/(d*d+300))*24;b.vx+=(dx/d)*force*dt;b.vy+=(dy/d)*force*dt;b.vx*=Math.pow(.992,dt*60);b.vy*=Math.pow(.992,dt*60);b.x+=b.vx*dt;b.y+=b.vy*dt;b.age+=dt;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.72;tone(240,.06,.025)}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.72;tone(240,.06,.025)}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*.72}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.72}if(d<24&&sign>0){b.done=true;score+=100;earned+=3;$('score').textContent=score;tone(860,.16);$('hint').textContent='CAPTURADA! +100'}if(b.age>12)b.done=true}orbs=orbs.filter(b=>!b.done);let beat=Math.floor(t/330);if(musicOn&&beat!==musicStep){musicStep=beat;tone([220,277,330,277,196,247,294,247][beat%8],.16,.014)}draw();raf=requestAnimationFrame(frame)}function draw(){g.fillStyle='#111d34';g.fillRect(0,0,W,H);g.strokeStyle='#2b3f5e';for(let x=0;x<W;x+=30){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<H;y+=30){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}const color=skins.find(s=>s.id===save.skin)?.color||'#ff8d9c';g.beginPath();g.arc(W/2,H/2,27,0,Math.PI*2);g.fillStyle=color;g.shadowColor=color;g.shadowBlur=22;g.fill();g.shadowBlur=0;g.fillStyle='#122038';g.font='bold 28px system-ui';g.textAlign='center';g.fillText(polarity>0?'+':'−',W/2,H/2+9);for(let b of orbs){g.beginPath();g.arc(b.x,b.y,b.r,0,Math.PI*2);g.fillStyle=b.pol>0?'#ff9d9d':'#85c5ff';g.fill();g.fillStyle='#112039';g.font='bold 11px system-ui';g.fillText(b.pol>0?'+':'−',b.x,b.y+4)}}$('start').onclick=start;$('flip').onclick=flip;c.addEventListener('pointerdown',e=>{e.preventDefault();flip()});$('music').onclick=()=>{musicOn=!musicOn;initAudio();$('music').textContent='MÚSICA: '+(musicOn?'LIGADA':'DESLIGADA')};$('shop').onclick=e=>{let b=e.target.closest('[data-skin]');if(!b)return;let s=skins.find(x=>x.id===b.dataset.skin);if(!s)return;if(!save.owned.includes(s.id)){if(save.coins<s.cost)return;save.coins-=s.cost;save.owned.push(s.id)}save.skin=s.id;persist();draw()};window.addEventListener('resize',()=>{fit();draw()});fit();persist();draw()})();</script></body></html>
