<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BOMBA! — Kumo Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff;font:16px system-ui;text-align:center}header{padding:16px}a{color:#8df5d9}h1{font-size:52px;margin:8px}p{color:#bdc8df}canvas{display:block;width:min(96vw,650px);aspect-ratio:15/13;margin:12px auto;border:3px solid #52728b;border-radius:12px;background:#14253a;image-rendering:pixelated;touch-action:none}.hud{display:flex;justify-content:center;gap:22px;font-weight:800}button{background:#273c59;color:white;border:1px solid #7892ac;border-radius:12px;padding:12px 18px;font-weight:800;touch-action:none}.controls{display:flex;justify-content:center;align-items:center;gap:16px;margin:12px}.pad{display:grid;grid-template-columns:repeat(3,55px);gap:5px}.pad button{padding:13px 0}.bomb{background:#efb96c;color:#172032;font-size:20px;padding:28px 18px}#status{min-height:25px;color:#ffe19b}</style><header><a href="/jogos">← KUMO LAB</a><h1>BOMBA!</h1><p>Destrua as caixas, elimine os inimigos e encontre a saída.</p></header><div class="hud"><span>FASE <b id="level">1</b></span><span>VIDAS <b id="lives">3</b></span><span>PONTOS <b id="score">0</b></span></div><canvas id="game" width="600" height="520"></canvas><div id="status">Toque em começar</div><button id="start">COMEÇAR / REINICIAR</button><div class="controls"><div class="pad"><span></span><button data-dir="up">▲</button><span></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><button class="bomb" id="bomb">BOMBA ●</button></div><p>Teclado: setas ou WASD para mover, espaço para bomba.</p><script>(()=>{'use strict';const c=document.querySelector('#game'),g=c.getContext('2d'),$=s=>document.querySelector(s),T=40,C=15,R=13;let map=[],player,enemies=[],bombs=[],flames=[],level=1,lives=3,score=0,playing=false,last=0,acc=0,audio=null,exit={x:13,y:11},keys=new Set(),inv=0;function sound(f=300){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),v=audio.createGain();o.type='square';o.frequency.value=f;v.gain.value=.035;o.connect(v).connect(audio.destination);o.start();v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.stop(audio.currentTime+.13)}catch(e){}}function tile(x,y){return map[y]?.[x]??1}function reset(){map=Array.from({length:R},(_,y)=>Array.from({length:C},(_,x)=>x===0||y===0||x===C-1||y===R-1||(x%2===0&&y%2===0)?1:Math.random()<.48?2:0));for(let [x,y] of [[1,1],[2,1],[1,2],[13,11],[12,11],[13,10]])map[y][x]=0;player={x:1,y:1,range:2,capacity:1};enemies=[];for(let i=0;i<Math.min(7,2+level);i++){let spots=[];for(let y=1;y<R-1;y++)for(let x=1;x<C-1;x++)if(!tile(x,y)&&Math.abs(x-1)+Math.abs(y-1)>8)spots.push({x,y});if(spots.length){let p=spots[Math.random()*spots.length|0];enemies.push({...p,wait:0})}}bombs=[];flames=[];exit={x:13,y:11};inv=1.5;playing=true;sync();$('#status').textContent='Encontre a saída no canto inferior direito!'}function sync(){$('#level').textContent=level;$('#lives').textContent=lives;$('#score').textContent=score}function blocked(x,y,enemy=false){return tile(x,y)!==0||bombs.some(b=>b.x===x&&b.y===y&&(enemy||!(player.x===x&&player.y===y)))}function move(dx,dy){if(!playing)return;let x=player.x+dx,y=player.y+dy;if(!blocked(x,y)){player.x=x;player.y=y;if(enemies.some(e=>e.x===x&&e.y===y))hurt();if(x===exit.x&&y===exit.y&&enemies.length===0){level++;score+=500;sound(900);reset()}}}function place(){if(!playing||bombs.length>=player.capacity||bombs.some(b=>b.x===player.x&&b.y===player.y))return;bombs.push({x:player.x,y:player.y,t:2.1,range:player.range});sound(500)}function blast(b){sound(110);let cells=[[b.x,b.y]];for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])for(let n=1;n<=b.range;n++){let x=b.x+dx*n,y=b.y+dy*n,t=tile(x,y);if(t===1)break;cells.push([x,y]);if(t===2){map[y][x]=0;score+=10;break}}for(let [x,y] of cells){flames.push({x,y,t:.45});enemies=enemies.filter(e=>{if(e.x===x&&e.y===y){score+=100;return false}return true});if(player.x===x&&player.y===y)hurt();for(let other of bombs)if(other!==b&&other.x===x&&other.y===y)other.t=0}sync()}function hurt(){if(inv>0)return;lives--;sound(150);sync();if(lives<=0){playing=false;$('#status').textContent='FIM DE JOGO — tente novamente';return}player.x=1;player.y=1;inv=1.7}function update(dt){if(!playing)return;inv=Math.max(0,inv-dt);for(let b of [...bombs]){b.t-=dt;if(b.t<=0){bombs.splice(bombs.indexOf(b),1);blast(b)}}flames=flames.filter(f=>(f.t-=dt)>0);for(let e of enemies){e.wait-=dt;if(e.wait<=0){e.wait=.35+Math.random()*.3;let dirs=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>Math.random()-.5);for(let [dx,dy] of dirs){if(!blocked(e.x+dx,e.y+dy,true)&&!enemies.some(z=>z!==e&&z.x===e.x+dx&&z.y===e.y+dy)){e.x+=dx;e.y+=dy;break}}}if(e.x===player.x&&e.y===player.y)hurt()}if(flames.some(f=>f.x===player.x&&f.y===player.y))hurt();if(enemies.length===0)$('#status').textContent='Caminho livre! Vá até a saída verde.'}function rect(x,y,color,pad=0){g.fillStyle=color;g.fillRect(x*T+pad,y*T+pad,T-pad*2,T-pad*2)}function draw(){g.fillStyle='#172b3d';g.fillRect(0,0,600,520);for(let y=0;y<R;y++)for(let x=0;x<C;x++){rect(x,y,(x+y)%2?'#1b3543':'#203b49');let t=tile(x,y);if(t===1)rect(x,y,'#52647d',2);if(t===2)rect(x,y,'#c9915d',3)}rect(exit.x,exit.y,enemies.length?'#37584e':'#56e9a5',8);for(let b of bombs){rect(b.x,b.y,'#101727',7);g.fillStyle='#fff';g.fillRect(b.x*T+17,b.y*T+8,5,5)}for(let f of flames)rect(f.x,f.y,'#ffbd52',4);for(let e of enemies){g.fillStyle='#ff6e88';g.beginPath();g.arc(e.x*T+20,e.y*T+20,14,0,7);g.fill()}if(!inv||Math.floor(inv*12)%2===0){g.fillStyle='#80f6dc';g.beginPath();g.arc(player.x*T+20,player.y*T+20,15,0,7);g.fill();g.fillStyle='#172b3d';g.fillRect(player.x*T+14,player.y*T+15,4,4);g.fillRect(player.x*T+23,player.y*T+15,4,4)}}function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;acc+=dt;while(acc>=1/60){update(1/60);acc-=1/60}draw();requestAnimationFrame(loop)}let moveTimer=0;document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='Space'){if(!e.repeat)place();return}keys.add(e.code)});document.addEventListener('keyup',e=>keys.delete(e.code));setInterval(()=>{let d=keys.has('ArrowUp')||keys.has('KeyW')?[0,-1]:keys.has('ArrowDown')||keys.has('KeyS')?[0,1]:keys.has('ArrowLeft')||keys.has('KeyA')?[-1,0]:keys.has('ArrowRight')||keys.has('KeyD')?[1,0]:null;if(d)move(...d)},125);document.querySelectorAll('[data-dir]').forEach(b=>{let timer;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);let d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.dir];move(...d);timer=setInterval(()=>move(...d),150)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>clearInterval(timer))});$('#bomb').onclick=place;$('#start').onclick=()=>{level=1;lives=3;score=0;reset();sound(660)};requestAnimationFrame(loop)})();</script></html>
